{% extends "base.html" %}
{% block title %}Find Relationships{% endblock %}
{% block content %}
<div class="header"><div class="header-content"><div class="logo"><h1> DNA Relationship Finder</h1></div>
    <div class="admin-profile" onclick="toggleDropdown()"><div class="profile-icon">P</div><div id="dropdown" class="profile-dropdown"><div class="dropdown-item"> {{ user_id }}</div><div class="dropdown-item logout" onclick="logout()">Logout</div></div></div>
</div></div>
<div class="container">
    <div class="back-container"><a href="/police/dashboard" class="btn btn-back">← Back to Dashboard</a></div>
    <div class="card">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button onclick="showTab('single')" id="singleTabBtn" class="btn btn-primary">Single Relationships</button>
            <button onclick="showTab('compare')" id="compareTabBtn" class="btn btn-secondary">Compare Relationships</button>
        </div>
        <div id="singleTab">
            <h3>Search ID</h3><div class="search-bar"><input type="text" id="single_id" placeholder="Enter Sample ID (e.g., A001)"><button onclick="searchSingle()" class="btn btn-primary">Search</button></div>
            <div id="single_result" class="card" style="margin-top: 20px;"></div>
        </div>
        <div id="compareTab" style="display: none;">
            <h3>Compare Two Persons</h3><div class="form-group"><label>First Person ID</label><input type="text" id="id1" placeholder="Sample ID"></div>
            <div class="form-group"><label>Second Person ID</label><input type="text" id="id2" placeholder="Sample ID"></div>
            <button onclick="compareTwo()" class="btn btn-primary">Compare</button>
            <div id="compare_result" class="card" style="margin-top: 20px;"></div>
        </div>
    </div>
</div>
<script>
    function toggleDropdown() { document.getElementById("dropdown").classList.toggle("show"); }
    window.onclick = function(e) { if (!e.target.closest('.admin-profile')) document.getElementById("dropdown").classList.remove("show"); }
    function logout() { window.location.href = "/logout"; }
    function showTab(tab) {
        if (tab === 'single') {
            document.getElementById("singleTab").style.display = "block";
            document.getElementById("compareTab").style.display = "none";
            document.getElementById("singleTabBtn").className = "btn btn-primary";
            document.getElementById("compareTabBtn").className = "btn btn-secondary";
        } else {
            document.getElementById("singleTab").style.display = "none";
            document.getElementById("compareTab").style.display = "block";
            document.getElementById("singleTabBtn").className = "btn btn-secondary";
            document.getElementById("compareTabBtn").className = "btn btn-primary";
        }
    }
    async function searchSingle() {
        let sample_id = document.getElementById("single_id").value.trim();
        if (!sample_id) { document.getElementById("single_result").innerHTML = '<div class="alert alert-error">Please enter a Sample ID</div>'; return; }
        document.getElementById("single_result").innerHTML = '<p>Searching...</p>';
        try {
            let response = await fetch("/police/relationship/search", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `sample_id=${encodeURIComponent(sample_id)}` });
            let data = await response.json();
            if (data.error) document.getElementById("single_result").innerHTML = `<div class="alert alert-error">${data.error}</div>`;
            else if (data.results && data.results.length > 0) {
                let html = "<h4>Top 7 Relationships Found:</h4><ul>";
                for (let r of data.results) html += `<li><strong>${r.sample_id}</strong>: ${r.percentage}% - ${r.relationship} (Confidence: ${r.confidence})</li>`;
                html += "</ul>";
                document.getElementById("single_result").innerHTML = html;
            } else document.getElementById("single_result").innerHTML = "<p>No matches found.</p>";
        } catch (err) { document.getElementById("single_result").innerHTML = `<div class="alert alert-error">Request failed: ${err.message}</div>`; }
    }
    async function compareTwo() {
        let id1 = document.getElementById("id1").value.trim(), id2 = document.getElementById("id2").value.trim();
        if (!id1 || !id2) { document.getElementById("compare_result").innerHTML = '<div class="alert alert-error">Please enter both IDs</div>'; return; }
        document.getElementById("compare_result").innerHTML = '<p>Comparing...</p>';
        try {
            let response = await fetch("/police/relationship/compare", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: `id1=${encodeURIComponent(id1)}&id2=${encodeURIComponent(id2)}` });
            let data = await response.json();
            if (data.error) document.getElementById("compare_result").innerHTML = `<div class="alert alert-error">${data.error}</div>`;
            else document.getElementById("compare_result").innerHTML = `<p><strong>Percentage Match:</strong> ${data.percentage}%</p><p><strong>Relationship Type:</strong> ${data.relationship}</p><p><strong>Confidence Level:</strong> ${data.confidence}</p>`;
        } catch (err) { document.getElementById("compare_result").innerHTML = `<div class="alert alert-error">Request failed: ${err.message}</div>`; }
    }
</script>
{% endblock %}

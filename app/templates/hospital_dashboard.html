{% extends "base.html" %}
{% block content %}
<div class="header">
    <div class="header-content">
        <div class="logo"><h1>Hospital Dashboard</h1></div>
        <div class="admin-profile" onclick="toggleDropdown()">
            <div class="profile-icon">H</div>
            <div id="dropdown" class="profile-dropdown">
                <div class="dropdown-item">{{ user_id }}</div>
                <div class="dropdown-item logout" onclick="logout()">Logout</div>
            </div>
        </div>
    </div>
</div>
<div class="container">
    {% if msg %}
    <div class="alert alert-success">{{ msg }}</div>
    {% endif %}
    <div class="two-buttons">
        <a href="/hospital/add-data" class="btn btn-primary">Add New Data</a>
        <a href="/hospital/check-database" class="btn btn-primary">Check Database</a>
    </div>
    <div style="text-align:center"><a href="/" class="btn btn-secondary">← Back to Sectors</a></div>
</div>
<script>
    function toggleDropdown(){document.getElementById("dropdown").classList.toggle("show");}
    window.onclick=function(e){if(!e.target.closest('.admin-profile'))document.getElementById("dropdown").classList.remove("show");}
    function logout(){window.location.href="/logout";}
</script>
{% endblock %}

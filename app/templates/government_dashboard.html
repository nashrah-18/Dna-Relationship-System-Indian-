{% extends "base.html" %}
{% block title %}Government Headquarters{% endblock %}
{% block content %}
<div class="header"><div class="header-content"><div class="logo"><h1>Government Headquarters</h1><p>DNA Intelligence Monitoring</p></div>
    <div class="admin-profile" onclick="toggleDropdown()"><div class="profile-icon">G</div><div id="dropdown" class="profile-dropdown"><div class="dropdown-item"> {{ user_id }}</div><div class="dropdown-item logout" onclick="logout()"> Logout</div></div></div>
</div></div>
<div class="container">
    <div class="two-buttons">
        <a href="/government/hospital-activity" class="btn btn-primary">Monitor Hospital Activity</a>
        <a href="/government/police-activity" class="btn btn-primary">Monitor Police Activity</a>
    </div>
    <div style="text-align: center; margin-top: 20px;"><a href="/" class="btn btn-secondary">← Back to Sectors</a></div>
</div>
<script>
    function toggleDropdown() { document.getElementById("dropdown").classList.toggle("show"); }
    window.onclick = function(e) { if (!e.target.closest('.admin-profile')) document.getElementById("dropdown").classList.remove("show"); }
    function logout() { window.location.href = "/logout"; }
</script>
{% endblock %}
